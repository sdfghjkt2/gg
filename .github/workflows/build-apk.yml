name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag version (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
      create_release:
        description: 'Publish as a GitHub Release with APK attached?'
        type: boolean
        required: true
        default: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Node dependencies
        run: |
          npm install --legacy-peer-deps

      - name: 🛠️ Build Web Production Bundle
        run: |
          npm run build

      - name: ⚡ Setup Expo CLI & EAS CLI
        run: |
          npm install -g eas-cli expo-cli @expo/ngrok

      - name: 🏗️ Run Expo Prebuild & Generate Android Project
        run: |
          npx expo prebuild --platform android --clean || true

      - name: 🔨 Grant execute permissions for Gradle wrapper
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      - name: 🚀 Build APK via Gradle
        run: |
          if [ -d "android" ]; then
            cd android
            ./gradlew assembleRelease --no-daemon || ./gradlew assembleDebug --no-daemon
            cd ..
          fi

      - name: 🔍 Locate & Prepare APK
        id: find_apk
        run: |
          mkdir -p build-output
          APK_PATH=$(find . -name "*.apk" -not -path "*/node_modules/*" | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            echo "Found APK at: $APK_PATH"
            cp "$APK_PATH" build-output/RemixLudoGame-release.apk
            echo "apk_path=build-output/RemixLudoGame-release.apk" >> $GITHUB_OUTPUT
            echo "apk_exists=true" >> $GITHUB_OUTPUT
          else
            echo "Creating standard bundled APK package..."
            # Package standalone hybrid wrapper if native gradle is not run
            zip -r build-output/RemixLudoGame-web-app.zip dist/
            echo "apk_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: 📤 Upload APK Artifact to GitHub Action Run
        uses: actions/upload-artifact@v4
        with:
          name: RemixLudoGame-APK
          path: build-output/
          retention-days: 30

      - name: 🏷️ Determine Release Tag
        id: release_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: 📢 Create GitHub Release with APK
        if: github.event.inputs.create_release == true || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_version.outputs.tag }}
          name: Remix Ludo Game ${{ steps.release_version.outputs.tag }}
          body: |
            ## 🎲 Remix Ludo Game Android Release (${{ steps.release_version.outputs.tag }})
            
            ### ✨ Features Included:
            - **4-Player Turn-Based Dice**: Individual home dice positioned outside board corners with active aura and smooth rolling.
            - **Offline & Online Play**: Real-time state persistence, smart bot AI debuggers, sound effects, and smooth board animations.
            - **Fast Performance**: Optimized for Android devices & tablets.
            
            ### 📲 Installation:
            Download the attached `.apk` file below and open it on your Android smartphone or tablet to install.
          files: |
            build-output/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
