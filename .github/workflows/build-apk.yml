name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag version (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
      create_release:
        description: 'Publish as a GitHub Release with APK attached?'
        type: boolean
        required: true
        default: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js (v22 LTS for Capacitor CLI)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ☕ Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📱 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 🐘 Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
          validate-wrappers: false

      - name: 📦 Install Node dependencies
        run: |
          npm install --legacy-peer-deps

      - name: 🛠️ Build Web Production Bundle
        run: |
          npm run build

      - name: 🤖 Sync Capacitor Android Project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 🚀 Compile Android APK via Gradle
        run: |
          cd android
          rm -rf ~/.gradle/caches
          rm -rf ~/.gradle/wrapper/dists
          gradle wrapper --gradle-version 8.14.3
          chmod +x gradlew
          ./gradlew clean assembleDebug --refresh-dependencies --stacktrace --no-daemon
          cd ..

      - name: 🔍 Collect Output APK
        id: collect_apk
        run: |
          mkdir -p build-output
          APK_FILE=$(find android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "❌ Error: No APK file was generated!"
            exit 1
          fi
          echo "✅ Found APK at: $APK_FILE"
          cp "$APK_FILE" build-output/Ludo.apk
          cp "$APK_FILE" build-output/RemixLudoGame.apk
          ls -lh build-output/

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ludo-Android-APK
          path: build-output/Ludo.apk
          retention-days: 30

      - name: 🏷️ Determine Release Tag
        id: release_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: 📢 Publish GitHub Release with APK
        if: github.event.inputs.create_release == true || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_version.outputs.tag }}
          name: Ludo ${{ steps.release_version.outputs.tag }}
          body: |
            ## 🎲 Ludo Android Release (${{ steps.release_version.outputs.tag }})
            
            ### ✨ What's included:
            - **Native Standalone Android APK**: Ready to install directly on your Android phone or tablet with high-res launcher icon and splash screen.
            - **Complete Game Features**: 4-Player Turn-Based Home Dice, live multiplayer sync, smart bot AI, sound effects, and animations.
            
            ### 📲 How to Install:
            1. Download the `Ludo.apk` file attached below to your Android device.
            2. Tap the downloaded file to install (enable "Install unknown apps" if prompted).
            3. Open and enjoy the game!
          files: |
            build-output/Ludo.apk
            build-output/RemixLudoGame.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
